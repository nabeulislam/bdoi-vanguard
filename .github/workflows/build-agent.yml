name: Build Agent (All Platforms)

on:
  push:
    branches: [main]
    paths: ['agent/**']
  workflow_dispatch:

env:
  BDOI_SUPABASE_URL: ${{ secrets.BDOI_SUPABASE_URL }}
  BDOI_SUPABASE_ANON_KEY: ${{ secrets.BDOI_SUPABASE_ANON_KEY }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri

      # Linux dependencies
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libv4l-dev

      # macOS dependencies
      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: agent
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bdoi-vanguard-${{ matrix.label }}
          path: |
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bdoi-vanguard-${{ matrix.label }}
          path: |
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: bdoi-vanguard-${{ matrix.label }}
          path: |
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
