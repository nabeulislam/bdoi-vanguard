<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDOI Vanguard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #111;
      color: #ddd;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Logo */
    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #0af;
      margin-bottom: 20px;
    }

    /* Login */
    #login-view {
      width: 100%;
      max-width: 300px;
    }
    .form-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-title .icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .form-title h2 { font-size: 16px; font-weight: 600; color: #eee; }
    .form-title p { font-size: 12px; color: #666; margin-top: 4px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #777;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      color: #eee;
      font-size: 14px;
      font-family: sans-serif;
      outline: none;
    }
    .field input:focus { border-color: #0af; }
    .field input.mono { font-family: monospace; font-size: 12px; }

    .btn-login {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #0af;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      font-family: sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-login:hover { background: #09e; }
    .btn-login:disabled { opacity: 0.3; cursor: not-allowed; }

    .error-msg {
      color: #f44;
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
      word-break: break-word;
    }

    /* Monitor */
    #monitor-view {
      display: none;
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    .shield { font-size: 48px; margin-bottom: 12px; }
    .greeting { font-size: 22px; font-weight: 700; color: #eee; }
    .greeting span { color: #0af; }

    .status-pill {
      display: inline-block;
      padding: 6px 16px;
      margin: 14px 0 20px;
      background: #0f02;
      border: 2px solid #0f04;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #0f8;
    }
    .status-pill .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0f8;
      margin-right: 6px;
      vertical-align: middle;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .info-box {
      background: #1a1a1a;
      border: 2px solid #222;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .info-box .lbl { color: #666; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .info-box .val { color: #999; font-family: monospace; }

    .hint { margin-top: 16px; font-size: 11px; color: #444; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="app">
    <div class="logo">BDOI VANGUARD</div>

    <!-- Login -->
    <div id="login-view">
      <div class="form-title">
        <span class="icon">🛡</span>
        <h2>Contest Sign In</h2>
        <p>Enter your credentials to begin</p>
      </div>

      <div class="field">
        <label>Contest ID</label>
        <input type="text" id="contest-input" class="mono" placeholder="paste from dashboard" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@bdoi.org" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="your password" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In</button>
      <div id="error" class="error-msg"></div>
    </div>

    <!-- Monitoring -->
    <div id="monitor-view">
      <div class="shield">🛡️</div>
      <div class="greeting">Hi, <span id="user-name">—</span></div>
      <div class="status-pill"><span class="dot"></span>Monitoring Active</div>
      <div class="info-box">
        <span class="lbl">Contest</span>
        <span class="val" id="contest-id">—</span>
      </div>
      <div class="info-box">
        <span class="lbl">Session</span>
        <span class="val" id="session-id">—</span>
      </div>
      <div class="hint">
        You can minimize this window.<br>
        Do not close it during the contest.
      </div>
    </div>
  </div>

  <script>
    function getInvoke() {
      try {
        if (window.__TAURI__ && window.__TAURI__.core) return window.__TAURI__.core.invoke;
        if (window.__TAURI_INTERNALS__) {
          return function(cmd, args) {
            return window.__TAURI_INTERNALS__.invoke(cmd, args);
          };
        }
      } catch(e) {}
      return null;
    }

    async function doLogin() {
      var contestId = document.getElementById('contest-input').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error');
      var btn = document.getElementById('login-btn');

      if (!contestId || !email || !password) {
        errorEl.textContent = 'Please fill in all fields';
        return;
      }

      var invoke = getInvoke();
      if (!invoke) {
        errorEl.textContent = 'App not ready. Please wait and retry.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connecting...';
      errorEl.textContent = '';

      try {
        var result = await invoke('login', { contestId: contestId, email: email, password: password });
        if (result && result.success) {
          document.getElementById('user-name').textContent = result.name || email;
          document.getElementById('session-id').textContent = (result.user_id || '').slice(0, 8) + '...';
          document.getElementById('contest-id').textContent = contestId.slice(0, 8) + '...';
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('monitor-view').style.display = 'block';
        } else {
          errorEl.textContent = 'Unexpected response';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (e) {
        var msg = '';
        if (typeof e === 'string') msg = e;
        else if (e && e.message) msg = e.message;
        else try { msg = JSON.stringify(e); } catch(x) { msg = 'Login failed'; }
        errorEl.textContent = msg || 'Login failed';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('login-view').style.display !== 'none') {
        doLogin();
      }
    });
  </script>
</body>
</html>
